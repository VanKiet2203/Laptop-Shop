<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-label="Minh hoạ nâng cấp RAM và SSD">
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#15803d"/></linearGradient>
    <linearGradient id="ssd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
  </defs>
  <ellipse cx="280" cy="388" rx="230" ry="14" fill="#042f2e" opacity=".3"/>
  <!-- đường mạch -->
  <g stroke="#5eead4" stroke-width="3" fill="none" stroke-linecap="round" opacity=".55">
    <path d="M20 90h110l24 24h90"/><path d="M540 60H430l-24 24h-70"/><path d="M30 330h120l22-22h80"/><path d="M540 340H440l-22-22h-60"/>
  </g>
  <g fill="#5eead4" opacity=".7"><circle cx="20" cy="90" r="6"/><circle cx="540" cy="60" r="6"/><circle cx="30" cy="330" r="6"/><circle cx="540" cy="340" r="6"/></g>
  <!-- RAM -->
  <g transform="translate(70 70) rotate(-5)">
    <rect x="0" y="0" width="360" height="96" rx="10" fill="url(#pcb)"/>
    <g fill="#0f172a"><rect x="16" y="14" width="62" height="52" rx="5"/><rect x="88" y="14" width="62" height="52" rx="5"/><rect x="190" y="14" width="62" height="52" rx="5"/><rect x="262" y="14" width="62" height="52" rx="5"/></g>
    <g fill="#94a3b8"><rect x="22" y="22" width="22" height="4"/><rect x="94" y="22" width="22" height="4"/><rect x="196" y="22" width="22" height="4"/><rect x="268" y="22" width="22" height="4"/></g>
    <text x="180" y="86" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#dcfce7" letter-spacing="2">DDR5 · 16GB</text>
    <rect x="0" y="96" width="360" height="26" fill="#eab308"/>
    <g fill="#15803d">
      <rect x="8" y="102" width="5" height="20"/><rect x="19" y="102" width="5" height="20"/><rect x="29" y="102" width="5" height="20"/><rect x="40" y="102" width="5" height="20"/>
      <rect x="50" y="102" width="5" height="20"/><rect x="61" y="102" width="5" height="20"/><rect x="72" y="102" width="5" height="20"/><rect x="82" y="102" width="5" height="20"/>
      <rect x="93" y="102" width="5" height="20"/><rect x="103" y="102" width="5" height="20"/><rect x="114" y="102" width="5" height="20"/><rect x="125" y="102" width="5" height="20"/>
      <rect x="135" y="102" width="5" height="20"/><rect x="146" y="102" width="5" height="20"/>
      <rect x="186" y="102" width="5" height="20"/><rect x="197" y="102" width="5" height="20"/><rect x="207" y="102" width="5" height="20"/><rect x="218" y="102" width="5" height="20"/>
      <rect x="229" y="102" width="5" height="20"/><rect x="239" y="102" width="5" height="20"/><rect x="250" y="102" width="5" height="20"/><rect x="260" y="102" width="5" height="20"/>
      <rect x="271" y="102" width="5" height="20"/><rect x="282" y="102" width="5" height="20"/><rect x="292" y="102" width="5" height="20"/><rect x="303" y="102" width="5" height="20"/>
      <rect x="313" y="102" width="5" height="20"/><rect x="324" y="102" width="5" height="20"/><rect x="335" y="102" width="5" height="20"/><rect x="345" y="102" width="5" height="20"/>
    </g>
    <rect x="164" y="96" width="8" height="26" fill="#fde68a"/>
  </g>
  <!-- SSD -->
  <g transform="translate(150 230) rotate(4)">
    <rect x="0" y="0" width="300" height="118" rx="16" fill="url(#ssd)"/>
    <rect x="14" y="14" width="272" height="90" rx="8" fill="#020617"/>
    <rect x="30" y="30" width="46" height="46" rx="6" fill="#1e293b" stroke="#14b8a6" stroke-width="2"/>
    <rect x="86" y="30" width="46" height="46" rx="6" fill="#1e293b" stroke="#14b8a6" stroke-width="2"/>
    <text x="214" y="62" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#e2e8f0">NVMe</text>
    <text x="214" y="84" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#5eead4" letter-spacing="3">PCIe 4.0</text>
  </g>
  <!-- tia tốc độ -->
  <path d="M470 230l-34 54h26l-12 46 46-64h-28z" fill="#fde047"/>
</svg>
